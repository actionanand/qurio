<ion-app [class.has-bottom-nav]="auth.approved() && !challengeRoute()">
  @if (challengeRoute()) {
    <router-outlet />
  } @else {
    <a class="skip-link" href="#main">{{ i.t('skip') }}</a>
    <header class="app-header">
      <a class="brand" routerLink="/home" aria-label="Qurio">
        <img ngSrc="assets/qurio.png" width="52" height="52" alt="" priority />
        <span>Qurio</span>
      </a>
      @if (auth.approved()) {
        <a class="header-search" routerLink="/search" routerLinkActive="active" ariaCurrentWhenActive="page">
          <app-icon name="search" /><span>{{ i.t('search') }}</span>
        </a>
        <nav class="primary-nav" aria-label="Qurio">
          @for (item of navigation(); track item.route) {
            <a [routerLink]="item.route" routerLinkActive="active" ariaCurrentWhenActive="page">
              <app-icon [name]="item.icon" /><span>{{ i.t(item.label) }}</span>
            </a>
          }
        </nav>
      }
    </header>
    <main id="main" tabindex="-1">
      @if (preferences.storageUnavailable() || progress.storageUnavailable()) {
        <p class="notice" role="status">{{ i.t('storage') }}</p>
      }
      <router-outlet />
    </main>
    <app-install-app-banner />
    <app-snackbar />
    <app-lock />
  }
</ion-app>
